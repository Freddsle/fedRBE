# Dataset configurations for real-dataset evaluation.
# Single source of truth: both Python and R read from this file.
# All paths are relative to the repository root.

ecoli:
  before_matrix: evaluation_data/ecoli/before/central_intensities_log_UNION.tsv
  before_site_matrix_file: intensities_log_UNION.tsv
  corrected_central: evaluation_data/ecoli/after/label_aware/intensities_log_Rcorrected_UNION.tsv
  corrected_federated: evaluation_data/ecoli/after/label_aware/FedApp_corrected_data_smpc.tsv
  sites_root: evaluation_data/ecoli/before
  site_glob: "lab_*"
  design_file: design.tsv
  sample_col: file
  condition_col: Pyr

ovarian_cancer:
  before_matrix: evaluation_data/ovarian_cancer/before/central_input.zip
  before_site_matrix_file: expr_for_correction_UNION.tsv
  corrected_central: evaluation_data/ovarian_cancer/after/label_aware/central_corrected_UNION.tsv
  corrected_federated: evaluation_data/ovarian_cancer/after/label_aware/FedApp_corrected_data_smpc.tsv
  sites_root: evaluation_data/ovarian_cancer/before
  site_glob: "GSE*"
  design_file: design.tsv
  sample_col: file
  condition_col: HGSC

ccRCC_proteomics:
  before_matrix: evaluation_data/ccRCC_studies/before/central_intensities_log_UNION.tsv
  before_site_matrix_file: report_filtered.tsv
  corrected_central: evaluation_data/ccRCC_studies/after/label_aware/intensities_log_Rcorrected_UNION.tsv
  corrected_federated: evaluation_data/ccRCC_studies/after/label_aware/FedApp_corrected_data_smpc.tsv
  sites_root: evaluation_data/ccRCC_studies/before
  site_glob: "P*"
  design_file: design.tsv
  sample_col: rowname
  condition_col: Condition

# Quartet uses all three modalities stacked by pseudo-matched sample IDs.
# Canonical evaluators build joint matrices automatically through
# real_datasets_utils.build_quartet_matrices(); notebook 00 inspects that helper.
# Custom registries use explicit matrix paths without regenerating inputs.
# Per-feature scaling and k-means settings are shared with the other datasets.
quartet_multiomics:
  before_matrix: evaluation_data/quartet_multiomics/before/all_modalities_before_kmeans_matrix.tsv
  before_site_matrix_file: intensities.tsv
  corrected_central: evaluation_data/quartet_multiomics/after/label_aware/all_modalities_corrected_kmeans_matrix.tsv
  corrected_federated: evaluation_data/quartet_multiomics/after/label_aware/all_modalities_fedapp_kmeans_matrix.tsv
  sites_root: evaluation_clusterization_after_correction/real_datasets/quartet_multiomics/before
  site_glob: "client_*"
  design_file: design.tsv
  sample_col: file
  condition_col: condition
